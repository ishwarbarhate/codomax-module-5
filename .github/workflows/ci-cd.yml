name: Module 5 CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test HTML File
        run: |
          test -f index.html
          echo "HTML file exists"

      - name: Build Docker Image
        run: |
          docker build -t codomax-module5 .

      - name: Run Docker Container
        run: |
          docker run -d -p 8080:80 --name module5-test codomax-module5
          sleep 5

      - name: Test Web Application
        run: |
          curl http://localhost:8080
          echo "Web application test successful"
